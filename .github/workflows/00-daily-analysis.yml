name: Telegram report status verification

'on':
  workflow_dispatch:
    inputs:
      mode:
        description: Compatibility input; this branch never starts stock analysis
        default: stocks-only
        type: choice
        options: [full, market-only, stocks-only]
      force_run:
        description: Send one fixed English test notice; never starts stock analysis
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  telegram-status:
    runs-on: ubuntu-latest
    environment: STOCK_LIST
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify connectivity and optionally send one status notice
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
          SEND_STATUS_NOTICE: ${{ github.event.inputs.force_run }}
        run: |
          python - <<'PY'
          import json
          import os
          import socket
          import time
          import urllib.error
          import urllib.request

          raw_token = os.getenv("TELEGRAM_BOT_TOKEN", "")
          raw_chat = os.getenv("TELEGRAM_CHAT_ID", "")
          token, chat = raw_token.strip(), raw_chat.strip()
          print(json.dumps({"token_present": bool(token), "chat_present": bool(chat),
                            "thread_present": bool(os.getenv("TELEGRAM_MESSAGE_THREAD_ID", "").strip()),
                            "token_outer_whitespace": token != raw_token,
                            "chat_outer_whitespace": chat != raw_chat}))

          def probe(method, payload=None):
              started = time.monotonic()
              try:
                  request = urllib.request.Request(
                      "https://api.telegram.org/bot" + token + "/" + method,
                      data=json.dumps(payload or {}).encode("utf-8"),
                      headers={"Content-Type": "application/json"}, method="POST")
                  with urllib.request.urlopen(request, timeout=30) as response:
                      status = response.status
                      data = json.load(response)
                  ok = isinstance(data, dict) and data.get("ok") is True
                  print(json.dumps({"probe": method, "http_status": status, "ok": ok,
                                    "seconds": round(time.monotonic() - started, 2)}))
                  return data.get("result") if ok else None
              except urllib.error.HTTPError as error:
                  print(json.dumps({"probe": method, "http_status": error.code,
                                    "ok": False, "seconds": round(time.monotonic() - started, 2)}))
              except Exception as error:
                  reason = getattr(error, "reason", error)
                  kind = "timeout" if isinstance(reason, (TimeoutError, socket.timeout)) else "connection_error"
                  print(json.dumps({"probe": method, "ok": False, "error": kind,
                                    "seconds": round(time.monotonic() - started, 2)}))
              return None

          if not token or not chat:
              print(json.dumps({"result": "missing_configuration"}))
              raise SystemExit(1)
          me = probe("getMe")
          target = probe("getChat", {"chat_id": chat})
          member = probe("getChatMember", {"chat_id": chat, "user_id": me["id"]}) if isinstance(me, dict) and "id" in me else None
          if isinstance(member, dict):
              status = member.get("status")
              allowed = {"creator", "administrator", "member", "restricted", "left", "kicked"}
              print(json.dumps({"membership": status if status in allowed else "unknown",
                                "can_post_messages": member.get("can_post_messages") if isinstance(member.get("can_post_messages"), bool) else None,
                                "can_send_messages": member.get("can_send_messages") if isinstance(member.get("can_send_messages"), bool) else None}))
          ok = isinstance(me, dict) and isinstance(target, dict) and isinstance(member, dict)
          requested = os.getenv("SEND_STATUS_NOTICE", "").lower() == "true"
          confirmed = False
          if requested and ok:
              notice = (
                  "Aql Al Ashum: Telegram test message.\n"
                  "Notification delivery is being checked.\n"
                  "Stock analysis is being repaired separately.\n"
                  "No financial trades were executed."
              )
              payload = {"chat_id": chat, "text": notice, "disable_web_page_preview": True}
              thread = os.getenv("TELEGRAM_MESSAGE_THREAD_ID", "").strip()
              if thread:
                  payload["message_thread_id"] = thread
              delivered = probe("sendMessage", payload)
              confirmed = isinstance(delivered, dict)
          print(json.dumps({"result": "status_verification_completed", "read_probes_ok": ok,
                            "status_attempted": requested and ok, "status_confirmed": confirmed,
                            "stock_analysis_runs": 0, "automatic_retries": 0}))
          raise SystemExit(0 if ok and (not requested or confirmed) else 1)
          PY
