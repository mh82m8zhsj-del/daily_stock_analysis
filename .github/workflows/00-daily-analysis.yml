name: Gemini model availability diagnosis

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-gemini-models:
    runs-on: ubuntu-latest
    environment: STOCK_LIST
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: List supported Gemini text models without generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL }}
          GEMINI_MODEL_FALLBACK: ${{ vars.GEMINI_MODEL_FALLBACK || secrets.GEMINI_MODEL_FALLBACK }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          import re
          import socket
          import urllib.error
          import urllib.parse
          import urllib.request

          # Use the same precedence as Config, without ever logging credentials.
          keys = [value.strip() for value in os.getenv("GEMINI_API_KEYS", "").split(",") if value.strip()]
          key = keys[0] if keys else os.getenv("GEMINI_API_KEY", "").strip()
          public_name = re.compile(r"(?:models/)?[A-Za-z0-9][A-Za-z0-9_.-]{0,150}")
          def model_name(value):
              return value if public_name.fullmatch(value) else "unset_or_nonstandard"

          print(json.dumps({"api_key_present": bool(key),
                            "configured_model": model_name(os.getenv("GEMINI_MODEL", "").strip()),
                            "configured_fallback": model_name(os.getenv("GEMINI_MODEL_FALLBACK", "").strip()),
                            "generation_requests": 0, "notifications_sent": 0}))
          if not key:
              print(json.dumps({"result": "missing_configuration"}))
              raise SystemExit(1)

          names = []
          next_page = ""
          complete = False
          for page in range(5):
              params = {"pageSize": "100"}
              if next_page:
                  params["pageToken"] = next_page
              request = urllib.request.Request(
                  "https://generativelanguage.googleapis.com/v1beta/models?" + urllib.parse.urlencode(params),
                  headers={"x-goog-api-key": key}, method="GET")
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      status = response.status
                      data = json.load(response)
                  print(json.dumps({"probe": "listModels", "page": page + 1, "http_status": status}))
              except urllib.error.HTTPError as error:
                  print(json.dumps({"probe": "listModels", "http_status": error.code, "ok": False}))
                  raise SystemExit(1) from None
              except Exception as error:
                  reason = getattr(error, "reason", error)
                  kind = "timeout" if isinstance(reason, (TimeoutError, socket.timeout)) else "connection_or_response_error"
                  print(json.dumps({"probe": "listModels", "ok": False, "error": kind}))
                  raise SystemExit(1) from None
              for item in data.get("models", []):
                  if not isinstance(item, dict):
                      continue
                  name = item.get("name", "")
                  methods = item.get("supportedGenerationMethods", [])
                  if isinstance(name, str) and public_name.fullmatch(name) and "generateContent" in methods:
                      names.append(name)
                      print(json.dumps({"model": name, "supportedGenerationMethods": ["generateContent"]}))
              next_page = data.get("nextPageToken", "")
              if not next_page:
                  complete = True
                  break
          print(json.dumps({"result": "model_list_complete" if complete else "model_list_truncated",
                            "supported_model_count": len(set(names)),
                            "generation_requests": 0, "notifications_sent": 0}))
          raise SystemExit(0 if complete else 1)
          PYTHON
